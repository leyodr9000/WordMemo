# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 本机 SDK 平台版本可能落后于依赖要求时仅提示不阻断
android.suppressUnsupportedCompileSdk=37
# AGP 9: 关闭内置 Kotlin + 新 DSL, 继续使用 KGP (org.jetbrains.kotlin.android) 插件结构
# (AGP 10 将移除旁路, 届时需迁移到 built-in Kotlin)
android.builtInKotlin=false
android.newDsl=false
# Miuix / Compose 新版需要非传递 R 引用保持关闭即可
android.nonFinalResIds=false